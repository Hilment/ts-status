<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TS 在线人数</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #fff; overflow: hidden;
  }
  .card {
    width: 100%; max-width: 360px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 36px 28px; text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  }
  .server-name { font-size: 14px; opacity: 0.85; margin-bottom: 8px; }
  .count-wrap { margin: 24px 0 20px; }
  .count-num { font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .count-label { font-size: 14px; opacity: 0.75; margin-top: 8px; }
  .count-sep { font-size: 32px; opacity: 0.4; margin: 0 4px; font-weight: 300; }
  .count-max { font-size: 32px; opacity: 0.6; font-weight: 400; font-variant-numeric: tabular-nums; }
  .meta-row {
    display: flex; justify-content: space-around;
    padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.15); margin-top: 20px;
  }
  .meta-item { text-align: center; }
  .meta-value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meta-label { font-size: 12px; opacity: 0.65; margin-top: 4px; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #1DC981; margin-right: 6px;
    animation: pulse 2s infinite; vertical-align: middle;
  }
  .status-dot.offline { background: #E8463A; animation: none; }
  .status-dot.loading { background: #EFAA17; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .trigger-btn, .refresh-btn {
    padding: 10px 20px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px; color: #fff; font-size: 13px; cursor: pointer;
    background: rgba(255, 255, 255, 0.2);
  }
  .trigger-btn:active, .refresh-btn:active { transform: scale(0.95); }
  .trigger-btn:disabled, .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .trigger-btn { background: rgba(255, 255, 255, 0.3); }
  .trigger-tip { margin-top: 8px; font-size: 11px; color: #7ee0b0; min-height: 16px; }
  .tip-text { margin-top: 10px; font-size: 11px; opacity: 0.5; }
  .error-msg { font-size: 13px; color: #ffd1d1; margin-top: 12px; word-break: break-all; }
  .addr-info { margin-top: 16px; font-size: 11px; opacity: 0.5; font-family: monospace; }
  .footer { margin-top: 6px; font-size: 11px; opacity: 0.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="server-name">
      <span class="status-dot loading" id="statusDot"></span>
      <span id="serverNameText">加载中...</span>
    </div>
    <div class="count-wrap">
      <div>
        <span class="count-num" id="onlineNum">--</span>
        <span class="count-sep">/</span>
        <span class="count-max" id="maxNum">--</span>
      </div>
      <div class="count-label">在线人数 / 上限</div>
    </div>
    <div class="meta-row">
      <div class="meta-item">
        <div class="meta-value" id="channelNum">--</div>
        <div class="meta-label">频道数</div>
      </div>
      <div class="meta-item">
        <div class="meta-value" id="uptimeText">--</div>
        <div class="meta-label">运行时长</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="trigger-btn" id="triggerBtn" onclick="triggerAction()">触发更新</button>
      <button class="refresh-btn" id="refreshBtn" onclick="fetchData(false)">刷新数据</button>
    </div>
    <div class="trigger-tip" id="triggerTip"></div>
    <div class="tip-text">定时每5分钟自动更新 / 点「触发更新」立即查询</div>
    <div class="error-msg" id="errorMsg" style="display:none;"></div>
    <div class="addr-info" id="addrInfo"></div>
    <div class="footer" id="updateTime"></div>
  </div>
<script>
  // ===== 配置区（替换为你的信息）=====
  const GITHUB_TOKEN  = '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';       // Fine-grained PAT（见 README 第 2 步）
  const GITHUB_OWNER  = 'Hilment';    // 你的 GitHub 用户名
  const GITHUB_REPO   = 'ts-status';        // 仓库名
  const WORKFLOW_FILE = 'query.yml';
  const BRANCH        = 'main';             // 分支是 master 就改成 master
  // ====================================

  const $ = id => document.getElementById(id);

  // 每次进入页面仅能触发一次（关闭页面后重置）
  const TRIGGER_KEY = 'ts_action_triggered';
  let alreadyTriggered = sessionStorage.getItem(TRIGGER_KEY) === '1';

  let lastQueryTime = null;   // 记录上一次数据的更新时间
  let pollTimer = null;
  let pollCount = 0;
  const POLL_INTERVAL = 15000;  // 每 15 秒查一次
  const POLL_MAX = 16;          // 最多查 16 次 = 4 分钟

  function initTriggerButton() {
    const btn = $('triggerBtn');
    if (alreadyTriggered) {
      btn.disabled = true;
      btn.textContent = '本次已触发';
    } else if (!GITHUB_TOKEN || GITHUB_TOKEN === 'YOUR_TOKEN') {
      btn.disabled = true;
      btn.textContent = '未配置Token';
    }
  }

  async function triggerAction() {
    if (alreadyTriggered) return;

    const btn = $('triggerBtn');
    btn.disabled = true;
    btn.textContent = '正在触发...';
    $('triggerTip').textContent = '';

    try {
      const response = await fetch(
        'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO +
        '/actions/workflows/' + WORKFLOW_FILE + '/dispatches',
        {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + GITHUB_TOKEN,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ ref: BRANCH })
        }
      );

      if (response.status === 204) {
        sessionStorage.setItem(TRIGGER_KEY, '1');
        alreadyTriggered = true;
        btn.textContent = '已触发';
        $('triggerTip').textContent = '已触发，正在等待新数据...';
        startPolling();
      } else {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.message || ('HTTP ' + response.status));
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '触发更新';
      $('triggerTip').textContent = '触发失败: ' + e.message;
      fetchData(false);
    }
  }

  function startPolling() {
    const baseTime = lastQueryTime;
    pollCount = 0;
    clearInterval(pollTimer);

    pollTimer = setInterval(async function () {
      pollCount++;
      await fetchData(true);

      if (lastQueryTime && lastQueryTime !== baseTime) {
        clearInterval(pollTimer);
        $('triggerTip').textContent = '✓ 数据已更新';
        $('triggerBtn').textContent = '已更新';
      } else if (pollCount >= POLL_MAX) {
        clearInterval(pollTimer);
        $('triggerTip').textContent = '查询较慢，可稍后点「刷新数据」再看看';
      } else {
        $('triggerTip').textContent = '正在等待新数据...（已等 ' + (pollCount * 15) + ' 秒）';
      }
    }, POLL_INTERVAL);
  }

  function formatUptime(s) {
    if (!s) return '--';
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
    if (d > 0) return d + '天' + h + '时';
    const m = Math.floor((s % 3600) / 60);
    if (h > 0) return h + '时' + m + '分';
    return m + '分钟';
  }

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  async function fetchData(silent) {
    const btn = $('refreshBtn'), err = $('errorMsg');
    if (!silent) { btn.disabled = true; btn.textContent = '刷新中...'; }
    err.style.display = 'none';
    try {
      const res = await fetch('status.json?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('数据文件不存在');
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '查询失败');

      lastQueryTime = data.queryTime;

      $('statusDot').className = 'status-dot';
      $('serverNameText').textContent = data.serverName || 'TeamSpeak 服务器';
      $('onlineNum').textContent = data.online ?? '--';
      $('maxNum').textContent = data.max ?? '--';
      $('channelNum').textContent = data.channels ?? '--';
      $('uptimeText').textContent = formatUptime(data.uptime);
      $('addrInfo').textContent = data.host ? data.host + ':' + (data.voicePort || '') : '';
      $('updateTime').textContent = '更新于 ' + formatTime(data.queryTime);
    } catch (e) {
      $('statusDot').className = 'status-dot offline';
      $('serverNameText').textContent = '获取失败';
      $('onlineNum').textContent = '--'; $('maxNum').textContent = '--';
      err.textContent = e.message || '网络错误'; err.style.display = 'block';
    } finally {
      if (!silent) { btn.disabled = false; btn.textContent = '刷新数据'; }
    }
  }

  initTriggerButton();
  fetchData(false);
  setInterval(function () { fetchData(true); }, 60000);
</script>
</body>
</html>
