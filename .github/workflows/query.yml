name: TS Status Query

on:
  schedule:
    # 每 5 分钟自动查询一次
    - cron: '*/5 * * * *'
  # 支持手动触发（网页上的按钮和 Actions 页面的 Run workflow）
  workflow_dispatch:
  # 推送代码时也跑一次
  push:
    branches: [main]

# 需要写权限才能把查询结果提交回仓库
permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Query TeamSpeak server
        env:
          TS3CN_SERVER_ID: ${{ secrets.TS3CN_SERVER_ID }}
          TS3CN_EMAIL: ${{ secrets.TS3CN_EMAIL }}
          TS3CN_PASSWORD: ${{ secrets.TS3CN_PASSWORD }}
        run: node scripts/query.js

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 写一个时间戳文件，保证仓库一直有活动，
          # 避免 GitHub 因「60 天无活动」自动停掉定时任务
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_update
          git add docs/status.json .last_update
          git commit -m "更新 TS 在线人数 [auto]" || echo "无变化，跳过本次提交"
          git push
