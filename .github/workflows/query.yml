name: TS Status Query

# ─────────────────────────────────────────────────────────────
# 调度设计说明
#
# 【旧方案的问题：cron: '*/5 * * * *'】
#   */5 是 GitHub Actions 允许的最短间隔，同时踩中官方文档明确警告的三个坑：
#     1. 最短间隔 5 分钟 = 没有任何余量，一旦排队就永久丢拍；
#     2. */5 的分钟位是 0/5/10/.../55，其中 :00 恰好是每小时负载最高峰，
#        而 GitHub 文档明确建议「安排在每个小时的不同时间以降低延迟」；
#     3. 官方原文：高峰时「部分排队作业可能被丢弃（dropped）」——
#        是丢弃，不是延后。
#   实测（近 15.8 天、99 个相邻间隔）：
#     中位间隔 3.79 小时，平均 3.83 小时，最长空档 8.69 小时；
#     达成率 100 次 / 应有的 4552 次 = 2.2%；
#     没有任何一个间隔小于 1 小时。
#
# 【新方案】
#   频率降到 20 分钟，分钟位定在 :07 / :27 / :47，
#   既避开了整点洪峰，又让每小时开头留出 7 分钟缓冲。
#   标称间隔从 5 分钟变成 20 分钟（看数字变慢了），
#   但旧命中有 95% 的间隔大于 2 小时，
#   所以实际体验是从「平均 3.8 小时更新一次」
#   变成「稳定 20 分钟更新一次」——反而快了一个数量级。
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # 每 20 分钟一次，分钟位错开整点（避开每小时最高负载）
    - cron: '7,27,47 * * * *'
  # 支持手动触发（网页上的按钮和 Actions 页面的 Run workflow）
  workflow_dispatch:
  # 推送代码时也验证一次
  push:
    branches: [main]

# 需要写权限才能把查询结果提交回仓库
permissions:
  contents: write

# 同一时间只允许一个查询任务，避免手动触发与定时触发撞车导致 push 冲突
concurrency:
  group: ts-status-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Query TeamSpeak server
        env:
          TS3CN_SERVER_ID: ${{ secrets.TS3CN_SERVER_ID }}
          TS3CN_EMAIL: ${{ secrets.TS3CN_EMAIL }}
          TS3CN_PASSWORD: ${{ secrets.TS3CN_PASSWORD }}
        # 查询脚本失败（例如 ts3.com.cn 短暂不可用）不应让整个任务标红，
        # 否则会持续向仓库发失败通知。允许失败继续，稍后只提交成功结果。
        continue-on-error: true
        run: node scripts/query.js

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 只在查询确实成功时提交，避免把一次网络抖动写成「离线」状态。
          if ! grep -q '"success": true' docs/status.json; then
            echo "::warning::本次查询未成功，跳过提交以保留上一次的有效数据"
            exit 0
          fi

          # 写一个时间戳文件，保证仓库一直有活动，
          # 避免 GitHub 因「60 天无活动」自动停掉定时任务
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_update

          git add docs/status.json .last_update
          git commit -m "更新 TS 在线人数 [auto]" || echo "无变化，跳过本次提交"

          # 手动触发与定时触发可能并发，push 前先 rebase，失败则重试
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $i 次推送失败，正在 rebase 后重试..."
            git pull --rebase --autostash origin main
          done
          echo "::error::推送连续失败 3 次"
          exit 1
