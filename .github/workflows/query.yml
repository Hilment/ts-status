name: TS Status Query

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Query TeamSpeak server
        env:
          TS3CN_SERVER_ID: ${{ secrets.TS3CN_SERVER_ID }}
          TS3CN_EMAIL: ${{ secrets.TS3CN_EMAIL }}
          TS3CN_PASSWORD: ${{ secrets.TS3CN_PASSWORD }}
        run: node scripts/query.js

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/status.json
          git commit -m "更新 TS 在线人数 [auto]" || echo "无变化但仍提交"
          git push
